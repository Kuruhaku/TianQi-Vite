<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TainQi Saito</title>
    <link rel="stylesheet" href="/style/weatherStyle.css" />
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  </head>
  <body>
    <div class="news-container">
      <div class="background-container nofading"></div>
      <div id="particles-js"></div>
      <div class="transition-swipe nonactive">
        <div class="weather-page-container">
          <div class="weather-condition-container">
            <div class="location-container">
              <h1 id="display-weather-area"></h1>

              <div class="area-container">
                <img id="area-image" src="/location-on.svg" alt="" />

                <p id="display-weather-country"></p>
                <p id="display-weather-time"></p>
              </div>
            </div>

            <div class="input-glass">
              <div class="input-container">
                <input
                  type="text"
                  id="weather-input"
                  placeholder="Enter city or country"
                />
                <div class="error-container" style="display: none">
                  <p id="display-error"></p>
                </div>
                <button id="get-weather-button">Get Weather</button>
              </div>
            </div>

            <div class="nav-bar-container">
              <button id="nav-news-button">NEWS AND EVENT</button>
            </div>
          </div>

          <div class="weather-details-container">
            <div class="current-details-container">
              <div class="time-grid" style="grid-area: box-1">
                <p id="display-current-time">2025-06-29 18:00:00</p>
              </div>

              <div class="image-grid" style="grid-area: box-2">
                <img
                  id="display-weather-image"
                  src="https://openweathermap.org/img/wn/01d@2x.png"
                />
                <p id="display-weather-condition">Clear</p>
              </div>

              <div class="detail-grid" style="grid-area: box-3">
                <img src="/air.svg" alt="" />
                <p id="display-weather-temperature">25.14</p>
              </div>

              <div class="detail-grid" style="grid-area: box-4">
                <img src="/eco.svg" alt="" />
                <p id="display-weather-humidity">25.14</p>
              </div>

              <div class="detail-grid" style="grid-area: box-5">
                <img src="/air.svg" alt="" />
                <p id="display-weather-feels">25.14</p>
              </div>

              <div class="detail-grid" style="grid-area: box-6">
                <img src="/air.svg" alt="" />
                <p id="display-weather-pressure">1005</p>
              </div>
            </div>

            <div class="forecast-details-container"></div>
          </div>
        </div>
      </div>
    </div>

    <script defer type="module" src="src/pageBackground.js"></script>
    <script defer type="module" src="src/weatherApi.js"></script>
  </body>
</html>
